name: Sync Parquet Files to Kaggle

on:

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "Power Supply Statewise/**/*.parquet"

jobs:

  upload-to-kaggle:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Kaggle CLI
        run: |
          pip install kaggle

      - name: Verify Kaggle authentication
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          kaggle datasets list --search electricity-supply-states

      - name: Show Parquet files
        run: |
          echo "Parquet files:"
          find "Power Supply Statewise" -type f -name "*.parquet"

      - name: Upload to Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          kaggle datasets version \
            -p "Power Supply Statewise" \
            -m "Updated Parquet files"
