name: Power Supply ETL

on:
  # Run automatically whenever a parquet file is added/changed
  push:
    branches:
      - main
    paths:
      - "Power Supply Statewise/**/*.parquet"
  # Allow manual execution from GitHub
  workflow_dispatch:

jobs:
  power-supply-etl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Power Supply ETL
        # env:
        #   DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python "Data Pipeline Codes/power_supply_etl.py"
