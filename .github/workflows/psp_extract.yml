name: PSP Extract

on:
  schedule:
    - cron: "30 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  psp-extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PSP Extract
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          PSP_API_KEY: ${{ secrets.PSP_API_KEY }}
        run: |
          python "Data Pipeline Codes/psp_extract.py"
